version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: codeforge-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-codeforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codeforge_password}
      POSTGRES_DB: ${DB_NAME:-codeforge_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-codeforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeforge-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: codeforge-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeforge-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: development
    container_name: codeforge-backend
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-codeforge}:${DB_PASSWORD:-codeforge_password}@postgres:5432/${DB_NAME:-codeforge_ai}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379
      CELERY_RESULT_BACKEND: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - codeforge-network

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: codeforge-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - codeforge-network

  # Celery Worker (optional - for background tasks)
  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: development
    container_name: codeforge-celery
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-codeforge}:${DB_PASSWORD:-codeforge_password}@postgres:5432/${DB_NAME:-codeforge_ai}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379
      CELERY_RESULT_BACKEND: redis://redis:6379
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - backend
    command: celery -A app.workers:app worker --loglevel=info
    networks:
      - codeforge-network
    profiles:
      - workers

volumes:
  postgres_data:
  redis_data:

networks:
  codeforge-network:
    driver: bridge
