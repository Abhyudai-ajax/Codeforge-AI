# Generic single-database configuration

[alembic]
# The migration configuration lives in this directory; this works on every host.
script_location = %(here)s

# Runtime URL is supplied by app.core.config.Settings / DATABASE_URL.
sqlalchemy.url =

# Logging
log_file = %(here)s/alembic.log
log_file_level = INFO
sqlalchemy_echo = false
sqlalchemy_echo_pool = false
sqlalchemy_pool_pre_ping = true

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
