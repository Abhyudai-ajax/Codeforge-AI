# Generic single-database configuration

[alembic]
# absolute path to migration scripts to ensure alembic works from any cwd
script_location = E:/CodeForge AI/backend/alembic

sqlalchemy.url = driver://user:password@localhost/dbname

# Logging
log_file = %(here)s/alembic.log
log_file_level = INFO
sqlalchemy_echo = false
sqlalchemy_echo_pool = false
sqlalchemy_pool_pre_ping = true

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
